<script>
const SELF_JS = document.currentScript.textContent;

const CSS_TEXT = `
  :root{
    --bg:#0c0d13;
    --surface:#212227;
    --surface-2:#2b2b2a;
    --text:#fcf2e7;
    --muted:#a79c91;
    --accent:#7b91c4;
    --accent-ink:#12141c;
    --line:rgba(252,242,231,0.14);
    --shadow:0 1px 2px rgba(0,0,0,0.5);
  }
  *{box-sizing:border-box;}
  html,body{background:var(--bg);}
  body{color:var(--text);font-family:'Archivo',system-ui,sans-serif;line-height:1.5;padding-inline:0;margin:0;}
  a{color:inherit;}
  .wrap{max-width:1100px;margin-inline:auto;padding-inline:24px;}
  h1,h2,h3{font-weight:600;text-wrap:balance;margin:0;}
  h1,h2{font-family:'Fredoka',system-ui,sans-serif;font-weight:600;letter-spacing:0;}
  h3{font-family:'Archivo',sans-serif;font-weight:700;}
  .eyebrow{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent);}
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace;}
  nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb, var(--bg) 80%, transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
  nav .wrap{display:flex;align-items:center;justify-content:space-between;padding-block:16px;gap:16px;}
  .logo{display:flex;align-items:center;gap:10px;}
  .logo img{height:22px;width:auto;display:block;}
  .logo .tag{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);}
  .footer-logo{display:flex;align-items:center;gap:8px;}
  .footer-logo img{height:16px;width:auto;display:block;opacity:0.85;}
  .navlinks{display:flex;gap:28px;font-size:14px;font-weight:500;}
  .navlinks a{text-decoration:none;color:var(--muted);transition:color .15s ease;}
  .navlinks a:hover,.navlinks a:focus-visible{color:var(--text);}
  .hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line);background-size:cover;background-position:center 65%;}
  .hero-scrim{position:absolute;inset:0;background:linear-gradient(180deg, rgba(5,5,5,0.35) 0%, rgba(5,5,5,0.65) 55%, #050505 100%);}
  .beam{position:absolute;inset:-20% -10%;background:conic-gradient(from 200deg at 15% 20%,transparent 0deg,color-mix(in srgb, var(--accent) 26%, transparent) 18deg,transparent 40deg,transparent 360deg);opacity:0.8;animation:sweep 26s linear infinite;pointer-events:none;}
  @keyframes sweep{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}
  @media (prefers-reduced-motion: reduce){.beam{animation:none;}}
  .hero-inner{position:relative;padding-block:110px 80px;display:flex;flex-direction:column;gap:28px;max-width:760px;}
  .hero h1{font-size:clamp(38px,6.8vw,76px);line-height:1.04;letter-spacing:0;}
  .hero p.lede{font-size:18px;color:var(--muted);max-width:52ch;}
  .cta-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:999px;font-weight:600;font-size:13px;letter-spacing:0.03em;text-transform:uppercase;text-decoration:none;border:1.5px solid transparent;cursor:pointer;transition:transform .15s ease,opacity .15s ease,background .15s ease,color .15s ease;}
  .btn:hover{transform:translateY(-1px);}
  .btn-primary{background:var(--accent);color:var(--accent-ink);}
  .btn-ghost{border-color:var(--text);color:var(--text);}
  .btn-ghost:hover{background:var(--text);color:var(--bg);}
  section{padding-block:80px;}
  .sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:44px;flex-wrap:wrap;}
  .sec-head h2{font-size:clamp(28px,3.6vw,40px);}
  .sec-num{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--muted);}
  .settings{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:4px;overflow:hidden;}
  .setting{background:var(--surface);padding:32px 28px;display:flex;flex-direction:column;gap:14px;}
  .setting .tag{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--accent);letter-spacing:0.05em;}
  .setting h3{font-size:21px;}
  .setting p{color:var(--muted);font-size:14.5px;margin:0;}
  .process{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;}
  .step{border-top:2px solid var(--accent);padding-top:16px;display:flex;flex-direction:column;gap:8px;}
  .step .n{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--muted);}
  .step h3{font-size:17px;}
  .step p{margin:0;color:var(--muted);font-size:14px;}
  .grid-plates{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
  .plate{background:var(--surface-2);border:1px solid var(--line);border-radius:4px;overflow:hidden;transition:transform .18s ease,box-shadow .18s ease;display:block;text-decoration:none;color:inherit;}
  .plate:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,0.5);}
  .frame{aspect-ratio:4/3;position:relative;overflow:hidden;}
  .frame .fnum{position:absolute;top:10px;left:10px;font-family:'JetBrains Mono',monospace;font-size:11px;color:rgba(255,255,255,0.85);background:rgba(0,0,0,0.45);padding:2px 6px;border-radius:2px;}
  .frame.ig-frame{background-size:cover;background-position:center;}
  .ig-badge{position:absolute;top:10px;right:10px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.04em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent);padding:3px 8px;border-radius:2px;font-weight:700;}
  .plate-body{padding:16px 18px 20px;display:flex;flex-direction:column;gap:4px;}
  .plate-body h3{font-size:16px;}
  .plate-body .exif{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--muted);letter-spacing:0.02em;}
  .about{display:grid;grid-template-columns:1.1fr 0.9fr;gap:56px;align-items:start;}
  .about p{font-size:17px;color:var(--muted);max-width:56ch;}
  .values{display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start;}
  .pill{border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;color:var(--muted);}
  .contact-card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:44px;display:grid;grid-template-columns:1fr 1fr;gap:40px;}
  .contact-card h2{font-size:30px;}
  .spec-row{display:flex;justify-content:space-between;padding-block:12px;border-bottom:1px solid var(--line);font-size:14px;gap:12px;}
  .spec-row:last-child{border-bottom:none;}
  .spec-row .k{font-family:'JetBrains Mono',monospace;color:var(--muted);letter-spacing:0.04em;white-space:nowrap;}
  .spec-row .v a{text-decoration:none;font-weight:600;border-bottom:1px solid var(--accent);}
  footer{border-top:1px solid var(--line);padding-block:28px;}
  footer .wrap{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--muted);}
  .admin-fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;display:inline-flex;align-items:center;gap:8px;padding:12px 18px;border-radius:999px;background:var(--accent);color:var(--accent-ink);border:none;font-weight:700;font-size:13px;font-family:'Archivo',sans-serif;cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,0.4);}
  .admin-fab[hidden]{display:none;}
  .admin-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.6);opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:40;}
  .admin-backdrop.open{opacity:1;pointer-events:auto;}
  .admin-panel{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:var(--surface-2);border-left:1px solid var(--line);z-index:41;transform:translateX(105%);transition:transform .25s ease;overflow-y:auto;padding:24px 24px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:24px;}
  .admin-panel.open{transform:translateX(0);}
  .admin-head{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .admin-head h2{font-size:20px;}
  .admin-close{background:none;border:1px solid var(--line);border-radius:6px;width:32px;height:32px;cursor:pointer;font-size:15px;color:var(--text);}
  .admin-group{display:flex;flex-direction:column;gap:12px;padding-bottom:20px;border-bottom:1px solid var(--line);}
  .admin-group:last-of-type{border-bottom:none;}
  .admin-group h3{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin:0;}
  .admin-item{display:flex;flex-direction:column;gap:10px;padding:12px;border:1px solid var(--line);border-radius:6px;}
  .field{display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:12px;color:var(--muted);}
  .field input[type="text"],.field input[type="email"],.field textarea{
    font-family:'Archivo',sans-serif;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--text);width:100%;resize:vertical;
  }
  .field input[type="color"]{width:56px;height:32px;padding:2px;border:1px solid var(--line);border-radius:4px;background:var(--surface);cursor:pointer;}
  .admin-actions{position:sticky;bottom:0;background:var(--surface-2);display:flex;gap:10px;padding-top:12px;}
  .admin-status{font-size:12.5px;color:var(--muted);min-height:16px;}
  @media (max-width: 860px){
    .settings{grid-template-columns:1fr;}
    .process{grid-template-columns:1fr 1fr;}
    .grid-plates{grid-template-columns:1fr 1fr;}
    .about{grid-template-columns:1fr;}
    .contact-card{grid-template-columns:1fr;padding:28px;}
    .navlinks{gap:16px;font-size:13px;}
  }
  @media (max-width: 520px){
    .process{grid-template-columns:1fr 1fr;}
    .grid-plates{grid-template-columns:1fr;}
    .hero-inner{padding-block:80px 56px;}
  }
`;

document.getElementById('pageStyle').textContent = CSS_TEXT;

function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function safeColor(c){
  return /^#[0-9a-fA-F]{6}$/.test(c) ? c : '#c67d24';
}
function parseInstagramUrl(url){
  const m = String(url ?? '').match(/instagram\.com\/(p|reel|tv)\/([A-Za-z0-9_-]+)/);
  if(!m) return null;
  return {type:m[1], code:m[2], clean:`https://www.instagram.com/${m[1]}/${m[2]}/`};
}

function heroHTML(d){
  return `
    <span class="eyebrow">${esc(d.eyebrow)}</span>
    <h1>${esc(d.titleLine1)}<br>${esc(d.titleLine2)}</h1>
    <p class="lede">${esc(d.lede)}</p>

      <a class="btn btn-ghost" href="#contact">${esc(d.cta2)}</a>
    </div>`;
}
function servicesHTML(list){
  return list.map(s => `
    <div class="setting">
      <span class="tag">${esc(s.tag)}</span>
      <h3>${esc(s.title)}</h3>
      <p>${esc(s.desc)}</p>
    </div>`).join('');
}
function processHTML(list){
  return list.map((p,i) => `
    <div class="step">
      <span class="n mono">${String(i+1).padStart(2,'0')}</span>
      <h3>${esc(p.title)}</h3>
      <p>${esc(p.desc)}</p>
    </div>`).join('');
}
function portfolioHTML(list){
  return list.map((p,i) => {
    const ig = parseInstagramUrl(p.instagramUrl);
    const c = safeColor(p.color);
    const num = String(i+1).padStart(2,'0');
    const frame = p.image ? `
      <div class="frame ig-frame" style="background-image:url('${esc(p.image)}')">
        <span class="fnum">${num}</span>
        <span class="ig-badge">Instagram ↗</span>
      </div>` : `
      <div class="frame" style="background:linear-gradient(135deg, color-mix(in srgb, ${c} 35%, #140f08), ${c});">
        <span class="fnum">${num}</span>
      </div>`;
    const body = `
      <div class="plate-body">
        <h3>${esc(p.title)}</h3>
        <span class="exif">${esc(p.exif)}</span>
      </div>`;
    return ig
      ? `<a class="plate" href="${esc(ig.clean)}" target="_blank" rel="noopener">${frame}${body}</a>`
      : `<article class="plate">${frame}${body}</article>`;
  }).join('');
}

function buildFullDocument(data){
  return `<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RayVo Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>${CSS_TEXT}</style>
</head>
<body>
<div id="app"></div>
<script id="site-data" type="application/json">${JSON.stringify(data)}<\/script>
<script>${SELF_JS}<\/script>
</body>
</html>`;
}

let DATA = JSON.parse(document.getElementById('site-data').textContent);
let canEditCached = false;
let artifactCap = null;

function render(){
  document.getElementById('app').innerHTML = bodyShellHTML(DATA);
  applyAdminVisibility();
}
function applyAdminVisibility(){
  const fab = document.getElementById('adminFab');
  if(fab) fab.hidden = !canEditCached;
}

function openAdmin(){
  document.getElementById('adminPanel').classList.add('open');
  document.getElementById('adminBackdrop').classList.add('open');
}
function closeAdmin(){
  document.getElementById('adminPanel').classList.remove('open');
  document.getElementById('adminBackdrop').classList.remove('open');
}
function setStatus(msg){
  const el = document.getElementById('adminStatus');
  if(el) el.textContent = msg;
}

function collectFormData(){
  const v = id => (document.getElementById(id)?.value ?? '').trim();
  return {
    hero:{
      eyebrow:v('hero-eyebrow'), titleLine1:v('hero-title1'), titleLine2:v('hero-title2'),
      lede:v('hero-lede'), cta1:v('hero-cta1'), cta2:v('hero-cta2')
    },
    services:[0,1,2].map(i => ({tag:v(`svc${i}-tag`), title:v(`svc${i}-title`), desc:v(`svc${i}-desc`)})),
    process:[0,1,2,3].map(i => ({title:v(`proc${i}-title`), desc:v(`proc${i}-desc`)})),
    portfolio:[0,1,2,3,4,5].map(i => ({title:v(`port${i}-title`), exif:v(`port${i}-exif`), color:safeColor(v(`port${i}-color`)), instagramUrl:v(`port${i}-ig`)})),
    about:{
      heading:v('about-heading'), text:v('about-text'),
      pills:v('about-pills').split(',').map(s => s.trim()).filter(Boolean)
    },
    contact:{studio:v('contact-studio'), email:v('contact-email'), social:v('contact-social'), zone:v('contact-zone')}
  };
}

async function saveAdmin(){
  const btn = document.getElementById('adminSave');
  if(btn) btn.disabled = true;
  setStatus('Enregistrement…');
  const newData = collectFormData();
  DATA = newData;
  document.getElementById('site-data').textContent = JSON.stringify(DATA);
  render();
  if(!artifactCap){
    setStatus('Mode édition indisponible : les changements ne seront pas publiés.');
    return;
  }
  try{
    await artifactCap.publish(buildFullDocument(DATA));
    setStatus('Enregistré ✓ — la page se recharge…');
  }catch(err){
    const code = err && err.code;
    if(code === 'conflict'){
      setStatus('Quelqu’un d’autre vient de modifier la page. Rechargez pour voir la dernière version.');
    } else if(code === 'not_writer' || code === 'not_granted'){
      canEditCached = false;
      applyAdminVisibility();
      setStatus('Vous n’avez plus les droits de modification.');
    } else {
      setStatus('Échec de l’enregistrement. Réessayez dans un instant.');
    }
    if(btn) btn.disabled = false;
  }
}

document.body.addEventListener('click', e => {
  if(e.target.closest('#adminFab')){ openAdmin(); }
  else if(e.target.closest('#adminClose')){ closeAdmin(); }
  else if(e.target.closest('#adminBackdrop')){ closeAdmin(); }
  else if(e.target.closest('#adminCancel')){ closeAdmin(); }
  else if(e.target.closest('#adminSave')){ saveAdmin(); }
  else {
    const link = e.target.closest('a[href^="#"]');
    if(link){
      const target = document.getElementById(link.getAttribute('href').slice(1));
      if(target){ e.preventDefault(); target.scrollIntoView({behavior:'smooth', block:'start'}); }
    }
  }
});

async function initAdmin(){
  if(typeof claude === 'undefined' || !claude.use) return;
  const [a, u] = await Promise.all([
    claude.use('artifact').catch(() => null),
    claude.use('user').catch(() => null)
  ]);
  if(!a || !u) return;
  let ok = false;
  try{ ok = await u.canEdit(); }catch(e){ ok = false; }
  artifactCap = a;
  canEditCached = ok;
  applyAdminVisibility();
}

render();
initAdmin();
</script>
